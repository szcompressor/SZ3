<!-- fz search UI: Pagefind full-text only. (Doxygen SEARCHENGINE=NO.) -->
<link href="$relpath^pagefind/pagefind-ui.css" rel="stylesheet">
<script src="$relpath^pagefind/pagefind-ui.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
    new PagefindUI({
        element: "#pagefindsearch",
        showSubResults: true,
        translations: { placeholder: "" }
    });

    /* Auto-dismiss the Pagefind drawer when the user clicks outside.
       Pagefind's stock UI keeps results pinned until the input is cleared. */
    document.addEventListener('click', (e) => {
        const search = document.getElementById('pagefindsearch');
        if (!search) return;
        const drawer = search.querySelector('.pagefind-ui__drawer');
        const input  = search.querySelector('.pagefind-ui__search-input');
        if (!drawer || !input) return;
        if (search.contains(e.target)) return;
        if (input.value) {
            input.value = '';
            input.dispatchEvent(new Event('input',  { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
        }
    });
});
</script>
