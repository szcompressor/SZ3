name: Build & Test

on: [ push ]

env:
  BUILD_TYPE: Release
  TEST_URL: https://raw.githubusercontent.com/szcompressor/SZ3/master/tools/sz3/testfloat_8_8_128.dat
  DIMS: "128 8 8"
  MODE: ABS
  TOL: 1

# One job per platform: configure with every feature on, build, run the tests, round-trip the smoke
# dataset. Anything that needs more than one configuration of anything lives in its own workflow --
# packaging.yml for install and consume, hdf5.yml for the filter against more than one HDF5. The
# first job checks all of them, this one included, for keys that interpolate to nothing.
jobs:
  workflow-env:
    name: Every workflow declares the env it reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for env keys that interpolate to nothing
        shell: bash
        run: |
          # An undeclared key expands to the empty string and cannot be made to fail on its own, so
          # the argument it was carrying goes missing with nothing said. Splitting this workflow
          # into three left three of them behind in packaging.yml, across eight references.
          python3 tools/test/check_workflow_env.py

  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.calc.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Install HDF5 and Zstd
        run: |
          sudo apt-get update
          # libzstd-dev, not libzstd1: only the -dev package carries the libzstd.pc that sends this
          # job down the system-Zstd path. hdf5-tools carries h5repack, h5dump and h5ls.
          sudo apt-get install -y libhdf5-dev hdf5-tools libzstd-dev

      - name: Create build dir
        run: cmake -E make_directory build

      - name: Configure
        shell: bash
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            -DBUILD_H5Z_FILTER=ON

      - name: Build
        shell: bash
        working-directory: build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run CTest
        shell: bash
        working-directory: build
        run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Download test data
        shell: bash
        run: |
          curl -L -o input.dat ${{ env.TEST_URL }}

      - name: Run sz3 and check error
        shell: bash
        working-directory: build
        run: |
          ./tools/sz3/sz3 -f -i ../input.dat -3 ${{ env.DIMS }} -M ${{ env.MODE }} ${{ env.TOL }} -a \
                           -o out.dat -z out.sz3 \
            | tee sz3.log
          ERR=$(grep -E 'Max absolute error =' sz3.log \
                | sed -E 's/.*Max absolute error = *([0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?).*/\1/')

          [ -n "$ERR" ] || { echo "Could not parse Max absolute error!"; exit 1; }
          echo "Parsed error: $ERR"
          awk -v err="$ERR" -v tol="${{ env.TOL }}" 'BEGIN { if (err > tol) exit 1; }'

      - name: Run sz3 with OpenMP and check error
        shell: bash
        working-directory: build
        run: |
          # The OpenMP path splits the data along the slowest dimension and compresses each piece on
          # its own thread, so it has its own stream framing and its own decoder. Nothing else in CI
          # enters it.
          # find_package(OpenMP) is not REQUIRED, so a runner without it builds a library that reads
          # no OpenMP stream at all. Checking here names that as the cause instead of letting the
          # decoder report a stream it cannot read.
          grep -q '^OpenMP_CXX_FLAGS:STRING=.' CMakeCache.txt \
            || { echo "cmake found no OpenMP on this runner, so the OpenMP path is untested"; exit 1; }
          printf '[GlobalSettings]\nOpenMP = YES\n' > omp.config
          ./tools/sz3/sz3 -f -i ../input.dat -3 ${{ env.DIMS }} -M ${{ env.MODE }} ${{ env.TOL }} -a \
                           -c omp.config -o omp.dat -z omp.sz3 \
            | tee omp.log
          ERR=$(grep -E 'Max absolute error =' omp.log \
                | sed -E 's/.*Max absolute error = *([0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?).*/\1/')

          [ -n "$ERR" ] || { echo "Could not parse Max absolute error!"; exit 1; }
          echo "Parsed error: $ERR"
          awk -v err="$ERR" -v tol="${{ env.TOL }}" 'BEGIN { if (err > tol) exit 1; }'

          # A stream carries the thread count it was written with, and the reader asks the runtime
          # for that many. It may get fewer, and then it must still decode every chunk. Only
          # OMP_THREAD_LIMIT can force that: it caps the whole program, so a num_threads request
          # cannot exceed it. OMP_NUM_THREADS cannot -- num_threads overrides it -- so setting that
          # on the reader would leave the count unchanged and test nothing.
          for w in 1 4 8; do
            OMP_NUM_THREADS=$w ./tools/sz3/sz3 -f -i ../input.dat -3 ${{ env.DIMS }} \
                -M ${{ env.MODE }} ${{ env.TOL }} -c omp.config -z omp$w.sz3 > /dev/null
            ./tools/sz3/sz3 -f -s omp$w.sz3 -o omp$w.ref.dat -3 ${{ env.DIMS }} > /dev/null \
              || { echo "a $w-thread stream did not read back"; exit 1; }
            for l in 1 2 3; do
              OMP_THREAD_LIMIT=$l ./tools/sz3/sz3 -f -s omp$w.sz3 -o omp$w.$l.dat \
                  -3 ${{ env.DIMS }} > /dev/null \
                || { echo "$w-thread stream failed to read under OMP_THREAD_LIMIT=$l"; exit 1; }
              cmp -s omp$w.ref.dat omp$w.$l.dat \
                || { echo "OMP_THREAD_LIMIT=$l changed the data from a $w-thread stream"; exit 1; }
            done
          done

      - name: Compute SHA256 of compressed
        id: calc
        shell: bash
        working-directory: build
        run: |
          DIGEST=$(sha256sum out.sz3 | awk '{print $1}')
          echo "::set-output name=digest::$DIGEST"

      - name: Upload Linux-compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: temp-linux-out-sz3
          path: build/out.sz3

  toolchains:
    name: ${{ matrix.cc }} shared=${{ matrix.shared }}
    runs-on: ubuntu-latest
    # Separate from build-linux, which feeds one digest to compare and one artifact to
    # build-windows; a matrix would make both ambiguous.
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-12, gcc-14, clang-16, clang-18]
        shared: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain and HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev hdf5-tools libzstd-dev ${{ matrix.cc }}

      - name: Build and test
        shell: bash
        run: |
          # A header-only library sees more of a compiler than most: every template it has is
          # instantiated in the consumer's translation unit. BUILD_SHARED_LIBS decides what shape
          # hdf5sz3 and SZ3c take, and the static one is what a packager on Windows gets.
          CXX=${{ matrix.cc }}
          case "$CXX" in clang-*) CXX="clang++-${CXX#clang-}";; gcc-*) CXX="g++-${CXX#gcc-}";; esac
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DCMAKE_C_COMPILER=${{ matrix.cc }} \
                -DCMAKE_CXX_COMPILER="$CXX" \
                -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
                -DBUILD_TESTING=ON \
                -DBUILD_H5Z_FILTER=ON
          cmake --build build --parallel 4
          (cd build && ctest --output-on-failure -C ${{ env.BUILD_TYPE }})
          # Asserted, not assumed: the matrix leg has to have produced the shape it asked for.
          if [ "${{ matrix.shared }}" = "ON" ]; then
            test -e build/tools/H5Z-SZ3/libhdf5sz3.so
          else
            test -e build/tools/H5Z-SZ3/libhdf5sz3.a
          fi

  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    outputs:
      digest: ${{ steps.calc.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Install HDF5
        run: |
          brew update
          brew install hdf5

      - name: Create build dir
        run: cmake -E make_directory build

      - name: Configure
        shell: bash
        working-directory: build
        run: |
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            -DBUILD_H5Z_FILTER=ON

      - name: Build
        shell: bash
        working-directory: build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run CTest
        shell: bash
        working-directory: build
        run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Download test data
        shell: bash
        run: |
          curl -L -o input.dat ${{ env.TEST_URL }}

      - name: Run sz3 and check error
        shell: bash
        working-directory: build
        run: |
          ./tools/sz3/sz3 -f -i ../input.dat -3 ${{ env.DIMS }} -M ${{ env.MODE }} ${{ env.TOL }} -a \
                           -o out.dat -z out.sz3 \
            | tee sz3.log
          ERR=$(grep -E 'Max absolute error =' sz3.log \
                | sed -E 's/.*Max absolute error = *([0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?).*/\1/')

          [ -n "$ERR" ] || { echo "Could not parse Max absolute error!"; exit 1; }
          echo "Parsed error: $ERR"
          awk -v err="$ERR" -v tol="${{ env.TOL }}" 'BEGIN { if (err > tol) exit 1; }'

      - name: Compute SHA256 of compressed
        id: calc
        shell: bash
        working-directory: build
        run: |
          DIGEST=$(shasum -a 256 out.sz3 | awk '{print $1}')
          echo "::set-output name=digest::$DIGEST"

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap vcpkg & install HDF5
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install hdf5:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create build dir
        shell: pwsh
        run: cmake -E make_directory build

      - name: Configure
        shell: pwsh
        working-directory: build
        run: |
          cmake .. `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_H5Z_FILTER=ON

      - name: Build
        shell: pwsh
        working-directory: build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run CTest
        shell: pwsh
        working-directory: build
        run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Download test data
        shell: pwsh
        run: Invoke-WebRequest -UseBasicParsing -Uri ${{ env.TEST_URL }} -OutFile input.dat

      - name: Run sz3 and check error
        shell: pwsh
        working-directory: build
        run: |
          .\tools\sz3\Release\sz3.exe -f -i ..\input.dat -3 ${{ env.DIMS }} -M ${{ env.MODE }} ${{ env.TOL }} -a `
                              -o out.dat -z out.sz3 2>&1 | Tee-Object sz3.log
          $match = Select-String -Pattern 'Max absolute error =\s*([0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?)' -Path sz3.log
          if (-not $match) {
            Write-Error "Could not parse Max absolute error!"
            exit 1
          }

          $err = [double]$match.Matches[0].Groups[1].Value
          Write-Host "Parsed error: $err"

          if ($err -gt [double]${{ env.TOL }}) {
            Write-Error "Error $err exceeds tolerance ${{ env.TOL }}"
            exit 1
          }


      - name: Download Linux-compressed artifact
        uses: actions/download-artifact@v4
        with:
          name: temp-linux-out-sz3
          path: .

      - name: Run sz3 to decompress and check error
        shell: pwsh
        working-directory: build
        run: |
          .\tools\sz3\Release\sz3.exe -f -i ..\input.dat -z ..\out.sz3 -a -o out_recon.dat `
            2>&1 | Tee-Object sz3.log

          $match = Select-String -Pattern 'Max absolute error =\s*([0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?)' -Path sz3.log
          if (-not $match) {
            Write-Error "Could not parse Max absolute error!"
            exit 1
          }

          $err = [double]$match.Matches[0].Groups[1].Value
          Write-Host "Parsed error: $err"

          if ($err -gt [double]${{ env.TOL }}) {
            Write-Error "Error $err exceeds tolerance ${{ env.TOL }}"
            exit 1
          }

  build-windows-mingw:
    name: Build & Test (Windows MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2 with MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-hdf5
            make

      - name: Create build dir
        run: cmake -E make_directory build

      - name: Configure
        working-directory: build
        run: |
          cmake .. \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTING=ON \
            -DBUILD_H5Z_FILTER=ON

      - name: Build
        working-directory: build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run CTest
        working-directory: build
        run: |
          export PATH="$PWD/bin:$PWD/lib:$PATH"
          ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Download test data
        run: |
          curl -L -o input.dat ${{ env.TEST_URL }}

      - name: Run sz3 and check error
        working-directory: build
        run: |
          ./tools/sz3/sz3.exe -f -i ../input.dat -3 ${{ env.DIMS }} -M ${{ env.MODE }} ${{ env.TOL }} -a \
                           -o out.dat -z out.sz3 \
            | tee sz3.log
          ERR=$(grep -E 'Max absolute error =' sz3.log \
                | sed -E 's/.*Max absolute error = *([0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?).*/\1/')

          [ -n "$ERR" ] || { echo "Could not parse Max absolute error!"; exit 1; }
          echo "Parsed error: $ERR"
          awk -v err="$ERR" -v tol="${{ env.TOL }}" 'BEGIN { if (err > tol) exit 1; }'

  compare:
    name: Compare Digests (Linux vs macOS)
    runs-on: ubuntu-latest
    needs: [ build-linux, build-macos ]
    steps:
      - name: Check that Linux and macOS digests match
        shell: bash
        run: |
          L=${{ needs.build-linux.outputs.digest }}
          M=${{ needs.build-macos.outputs.digest }}
          echo "linux: $L"
          echo "macos: $M"
          if [[ "$L" != "$M" ]]; then
            echo "::error ::Compressed outputs differ between Linux and macOS!"
            exit 1
          fi
          echo "Linux and macOS compressed outputs are identical."
