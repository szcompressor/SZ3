name: Integration Test

on:
  pull_request:
    branches:
      - master
      - fz

# One run per pull request. These jobs take hours; a new push must supersede the run in flight
# rather than compete with it for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dataset: [exaalt-small, hurricane, miranda, cesm-atm, scale-letkf, hacc, exaalt-copper, exaalt-helium]
      fail-fast: false
    name: Test ${{ matrix.dataset }}

    steps:

    - name: Disk space report before modification
      shell: bash
      run: |
        echo "Memory and swap:"
        sudo free -h
        echo
        sudo swapon --show
        echo

        echo "Available storage:"
        sudo df -h
        echo

    - name: Maximize build disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Disk space report after modification
      shell: bash
      run: |
        echo "Memory and swap:"
        sudo free -h
        echo
        sudo swapon --show
        echo

        echo "Available storage:"
        sudo df -h

    - uses: actions/checkout@v5

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev hdf5-tools
        python -m pip install --upgrade pip
        pip install numpy h5py requests --no-binary h5py

    - name: Run integration test
      run: |
        # -u: without it Python's stdout is block-buffered into the log pipe, so everything the driver
        # prints -- including the captured output of every test it runs -- is lost if the job is killed,
        # leaving a log that stops at the last subprocess write and says nothing about where it died.
        python -u tools/test/integration/integration_test_driver.py tools/test/integration/datasets.json ${{ matrix.dataset }}