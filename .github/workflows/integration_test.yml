name: Integration Test

on:
  pull_request:
    branches:
      - master

# One run per pull request. A newer push supersedes the one in flight, which otherwise queues a
# second full matrix and evicts the long jobs of the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # A dataset entry may name the fields to run, so one too slow to be a single job is spread
        # over several. hacc took 2h09 as one job, scale-letkf 1h00 and exaalt-helium 46m; the rest
        # were already under half an hour. Split to keep every job near 35 minutes.
        dataset:
          - exaalt-small
          - cesm-atm
          - miranda
          - hurricane
          - exaalt-copper-1
          - exaalt-copper-2
          - "hacc:vx"
          - "hacc:vz"
          - "hacc:vy"
          - "hacc:zz"
          - "hacc:xx"
          - "hacc:yy"
          - exaalt-helium-1
          - exaalt-helium-2
          - "scale-letkf:T,PRES,U,V,QC,QS"
          - "scale-letkf:QG,QV,W,QI,RH,QR"
          # Molecular dynamics trajectories, which arrive as {frames, atoms, xyz}. Nothing above
          # has three as its last dimension, so ALGO_BIOMD only ever sees the
          # layout it was written for through this.
          - md-peg-1chain
          - md-ifabp-water
          - md-adk-equilibrium
          - md-cg-fiber
          - md-membrane-peptide
          - md-nhaa-equilibrium
          - md-yiip-equilibrium
      fail-fast: false
    name: Test ${{ matrix.dataset }}

    steps:

    - name: Disk space report before modification
      shell: bash
      run: |
        echo "Memory and swap:"
        sudo free -h
        echo
        sudo swapon --show
        echo

        echo "Available storage:"
        sudo df -h
        echo

    - name: Maximize build disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a

    - name: Disk space report after modification
      shell: bash
      run: |
        echo "Memory and swap:"
        sudo free -h
        echo
        sudo swapon --show
        echo

        echo "Available storage:"
        sudo df -h

    - uses: actions/checkout@v5

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev hdf5-tools
        python -m pip install --upgrade pip
        pip install numpy h5py requests --no-binary h5py
        # SDRBench fields, fetched one file at a time from its Hugging Face mirror
        pip install "sdrbench>=0.1"
        # Reads the DCD, XTC and NetCDF trajectories the md-* datasets are published as.
        pip install MDAnalysis

    - name: Run integration test
      run: |
        python tools/test/integration/integration_test_driver.py tools/test/integration/datasets.json ${{ matrix.dataset }}

    - name: Upload compression metrics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: metrics-${{ strategy.job-index }}
        path: integration_metrics.csv
        if-no-files-found: ignore
